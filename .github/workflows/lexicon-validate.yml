name: Lexicon Validate

on:
  push:
    paths: ['lexicons/**']
  pull_request:
    paths: ['lexicons/**']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lexicons
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run validate
