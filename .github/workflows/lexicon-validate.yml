name: Lexicon Validate

on:
  push:
    paths: ['lexicons/**', 'test-vectors/**']
  pull_request:
    paths: ['lexicons/**', 'test-vectors/**']

permissions:
  contents: read

jobs:
  validate-lexicons:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lexicons
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run validate

  validate-test-vectors:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: test-vectors
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run validate
